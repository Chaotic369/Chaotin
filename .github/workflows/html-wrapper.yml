name: Build Native Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name (android:label)"
        required: false
        default: "Chaosin"
      app_version:
        description: "App version (versionName)"
        required: false
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_DIR: sovereign-app
      APP_NAME: ${{ github.event.inputs.app_name || 'Chaosin' }}
      APP_VERSION: ${{ github.event.inputs.app_version || '1.0.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Capacitor 7 compiles with Java 21 (Java 17 fails with "invalid source release: 21")
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Capacitor 7 / AGP 8.7 needs Gradle 8.9+ (8.7 is too old)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      # Bundles the web app into www/, runs "cap add android", patches permissions,
      # generates icons/splash and syncs (does NOT build the APK yet).
      - name: Generate native Android project
        working-directory: ${{ env.APP_DIR }}
        run: npm run setup

      - name: Patch app name and version
        run: |
          python3 - <<'PY'
          import os, re, sys
          from xml.sax.saxutils import escape

          root = os.path.join(os.environ["APP_DIR"], "android")
          name = os.environ["APP_NAME"].strip() or "Chaosin"
          version = os.environ["APP_VERSION"].strip() or "1.0.0"

          # ---- AndroidManifest.xml: android:label ----
          manifest_path = os.path.join(root, "app/src/main/AndroidManifest.xml")
          if not os.path.isfile(manifest_path):
              sys.exit("ERROR: " + manifest_path + " not found")
          with open(manifest_path, "r", encoding="utf-8") as f:
              manifest = f.read()
          label = escape(name, {'"': "&quot;"}).replace("'", "\\'")
          m = re.search(r"<application\b[^>]*>", manifest, re.S)
          if not m:
              sys.exit("ERROR: <application> tag not found in manifest")
          tag = m.group(0)
          if re.search(r'android:label\s*=\s*"[^"]*"', tag):
              new_tag = re.sub(r'android:label\s*=\s*"[^"]*"',
                               lambda _: 'android:label="%s"' % label, tag, count=1)
          else:
              new_tag = tag.replace("<application", '<application android:label="%s"' % label, 1)
          manifest = manifest[:m.start()] + new_tag + manifest[m.end():]
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(manifest)

          # ---- res/values/strings.xml: launcher/activity label used by Capacitor ----
          strings_path = os.path.join(root, "app/src/main/res/values/strings.xml")
          if os.path.isfile(strings_path):
              with open(strings_path, "r", encoding="utf-8") as f:
                  strings = f.read()
              for key in ("app_name", "title_activity_main"):
                  strings = re.sub(r'(<string\s+name="%s"[^>]*>)[^<]*(</string>)' % key,
                                   lambda mm: mm.group(1) + label + mm.group(2), strings)
              with open(strings_path, "w", encoding="utf-8") as f:
                  f.write(strings)

          # ---- app/build.gradle (Groovy) or build.gradle.kts: versionName / versionCode ----
          gradle_path = None
          for cand in ("app/build.gradle.kts", "app/build.gradle"):
              p = os.path.join(root, cand)
              if os.path.isfile(p):
                  gradle_path = p
                  break
          if not gradle_path:
              sys.exit("ERROR: app/build.gradle(.kts) not found in " + root)
          with open(gradle_path, "r", encoding="utf-8") as f:
              gradle = f.read()

          nums = [int(x) for x in re.findall(r"\d+", version)[:3]]
          while len(nums) < 3:
              nums.append(0)
          code = max(1, nums[0] * 1000000 + nums[1] * 1000 + nums[2])
          safe_version = version.replace("\\", "\\\\").replace('"', '\\"').replace("$", "\\$")
          kts = gradle_path.endswith(".kts")
          eq = " = " if kts else " "

          if re.search(r'versionName\s*=?\s*"[^"]*"', gradle):
              gradle = re.sub(r'(versionName\s*=?\s*)"[^"]*"',
                              lambda mm: mm.group(1) + '"' + safe_version + '"', gradle, count=1)
          else:
              gradle = re.sub(r"(defaultConfig\s*\{)",
                              lambda mm: mm.group(1) + '\n        versionName' + eq + '"' + safe_version + '"',
                              gradle, count=1)

          if re.search(r"versionCode\s*=?\s*\d+", gradle):
              gradle = re.sub(r"(versionCode\s*=?\s*)\d+",
                              lambda mm: mm.group(1) + str(code), gradle, count=1)
          else:
              gradle = re.sub(r"(defaultConfig\s*\{)",
                              lambda mm: mm.group(1) + "\n        versionCode" + eq + str(code),
                              gradle, count=1)

          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(gradle)

          print("Patched label=%r versionName=%r versionCode=%d in %s" % (name, version, code, gradle_path))
          PY

      - name: Inject app icon
        if: ${{ hashFiles('build-icon.png') != '' }}
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import glob, os, re
          from PIL import Image

          root = os.path.join(os.environ["APP_DIR"], "android")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          src = Image.open("build-icon.png").convert("RGBA")
          side = max(src.size)
          square = Image.new("RGBA", (side, side), (0, 0, 0, 0))
          square.paste(src, ((side - src.width) // 2, (side - src.height) // 2))

          res = os.path.join(root, "app/src/main/res")
          # Remove adaptive-icon XMLs that would override the PNGs on API 26+
          for p in glob.glob(res + "/mipmap-anydpi*/ic_launcher*.xml"):
              os.remove(p)

          for density, px in sizes.items():
              d = os.path.join(res, "mipmap-" + density)
              os.makedirs(d, exist_ok=True)
              # Remove existing launcher icons (any extension) to avoid duplicate resources
              for p in glob.glob(os.path.join(d, "ic_launcher*")):
                  os.remove(p)
              icon = square.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(os.path.join(d, "ic_launcher.png"))
              icon.save(os.path.join(d, "ic_launcher_round.png"))

          # Make sure the manifest points at the injected icons
          mp = os.path.join(root, "app/src/main/AndroidManifest.xml")
          with open(mp, "r", encoding="utf-8") as f:
              manifest = f.read()
          m = re.search(r"<application\b[^>]*>", manifest, re.S)
          tag = m.group(0)
          for attr, val in (("android:icon", "@mipmap/ic_launcher"),
                            ("android:roundIcon", "@mipmap/ic_launcher_round")):
              if re.search(re.escape(attr) + r'\s*=\s*"[^"]*"', tag):
                  tag = re.sub(re.escape(attr) + r'\s*=\s*"[^"]*"',
                               lambda _, a=attr, v=val: '%s="%s"' % (a, v), tag, count=1)
              else:
                  tag = tag.replace("<application", '<application %s="%s"' % (attr, val), 1)
          manifest = manifest[:m.start()] + tag + manifest[m.end():]
          with open(mp, "w", encoding="utf-8") as f:
              f.write(manifest)
          print("Icon injected into mipmap-* densities")
          PY

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name || 'Chaosin' }}
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error