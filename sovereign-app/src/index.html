<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafaf9"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Sovereign Protocol</title>
<link rel="stylesheet" href="app.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sp_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<style>
:root{--bg:#fffaf0;--s:#ffffff;--s2:#fdf1d8;--bd:#f0dfb5;--tx:#1c1917;--tm:#78716c;--ac:#f59e0b;--on:#000;--ok:#f59e0b;--er:#dc2626;--w:480px;color-scheme:light;--sh1:0 1px 2px rgba(120,80,0,.08),0 4px 14px rgba(120,80,0,.10);--sh2:0 1px 2px rgba(120,80,0,.10),0 2px 6px rgba(120,80,0,.10);--sh3:0 6px 22px rgba(120,80,0,.18);--shn:0 -4px 16px rgba(120,80,0,.10)}
[data-theme=dark]{--bg:#0c0c0d;--s:#141415;--s2:#1d1d1f;--bd:#2a2a2d;--tx:#f4f4f5;--tm:#a1a1aa;--ac:#7b9bff;--on:#0c0c0d;--ok:#4ade80;--er:#f87171;color-scheme:dark;--sh1:none;--sh2:none;--sh3:none;--shn:none}
*{box-sizing:border-box;margin:0}
body{font:16px/1.45 'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:none;background:var(--bg);color:var(--tx);padding-bottom:calc(120px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
body main{gap:14px;padding:16px 16px 14px}
main .card{border-radius:20px;padding:18px}
main .tile{border-radius:18px;padding:14px 16px}
main .tile b{font-size:22px}
main h2{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
main h3{font-size:20px;letter-spacing:-.02em}
body .btn{border-radius:14px;font-weight:600;transition:transform .12s ease,box-shadow .12s ease}
body .btn:active,body .ic:active{transform:scale(.96)}
main .now{margin:0 -10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--ac) 14%,var(--s));box-shadow:inset 3px 0 0 var(--ac)}
main .act{background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 20%,var(--s)),var(--s))}
body .ck{width:28px;height:28px;transition:background .15s ease,transform .12s ease}
body .ck:active{transform:scale(.9)}
body .chip{border-radius:999px;padding:3px 10px;font-weight:600}
main .seg{border-radius:14px;padding:4px}
main .seg button{border-radius:11px;font-weight:600}
main input{border-radius:14px}
nav{border-radius:22px 22px 0 0}
nav button{font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
body{padding-top:env(safe-area-inset-top)}

main{max-width:var(--w);margin:auto;padding:14px;display:grid;gap:12px}body.dk main{padding-bottom:190px}
.card{background:var(--s);border-radius:14px;padding:14px;box-shadow:var(--sh1)}
h2{font-size:13px;font-weight:600;color:var(--tm);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
h3{font-size:17px;margin-bottom:4px}
summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center;min-height:44px;list-style:none}
.row{display:flex;align-items:center;gap:10px;padding:10px 0}
.g{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center}.sub{font-size:14px;color:var(--tm)}.mu{color:var(--tm);text-decoration:line-through}.fl .mu{color:var(--er)}
.now{background:var(--s2);margin:0 -14px;padding:10px 14px}
input,select,textarea{width:100%;background:var(--s2);border:0;border-radius:12px;padding:10px 14px;font-size:16px;min-height:46px}
input:focus,select:focus,textarea:focus{outline:none}
input[type=checkbox]{width:auto}
button{cursor:pointer}button:focus-visible{outline:none}
.btn{border:0;background:var(--s2);border-radius:12px;padding:0 16px;min-height:46px;white-space:nowrap;box-shadow:var(--sh2)}
.btn.p{background:var(--ac);color:var(--on);font-weight:600;box-shadow:var(--sh3)}.btn.d{color:var(--er)}
.ic{border:0;background:none;color:var(--tm);min-width:44px;min-height:44px;font-size:19px;border-radius:12px}.ic:hover{background:var(--s2)}
.lnk{border:0;background:none;color:var(--ac);font-size:14px;font-weight:600;min-height:36px;padding:0 4px}
.ck{position:relative;width:26px;height:26px;border-radius:50%;border:0;background:var(--s2);flex:none;display:grid;place-items:center;color:var(--on);font-size:13px}
.ck.on{background:var(--ok)}.ck::after{content:"";position:absolute;inset:-10px}
.chip{font-size:12px;color:var(--tm);background:var(--s2);border:0;border-radius:7px;padding:3px 8px;white-space:nowrap}
.add{display:flex;gap:8px}.add+.row,.add+.chips{margin-top:10px}.chips{display:flex;flex-wrap:wrap;gap:6px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.act{background:var(--s2);box-shadow:var(--sh1)}.big{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hl{position:relative;flex:1;min-width:0}
.hl input{position:relative;color:transparent;caret-color:var(--tx)}
.th{position:absolute;inset:0;padding:0 16px;line-height:44px;font-size:16px;white-space:pre;overflow:hidden;color:var(--tx);pointer-events:none}
.th mark{background:none;color:var(--ac)}
.tp{display:flex;align-items:center;gap:8px;margin:0 4px 8px;padding:6px 6px 6px 14px;background:var(--s);border-radius:22px;box-shadow:var(--sh3);font-size:14px}
.tp[hidden]{display:none}
.tp span{flex:1;min-width:0;color:var(--tm)}
.dock .tp .btn{min-height:34px;min-width:52px;border-radius:17px}
.tp .ic{min-height:34px;min-width:34px;font-size:15px}
.tile{background:var(--s);border-radius:14px;padding:12px;box-shadow:var(--sh1)}.tile b{display:block;font-size:20px;letter-spacing:-.02em}.tile span{font-size:13px;color:var(--tm)}.tile.w{grid-column:1/-1}
.pos{color:var(--ok)}.neg{color:var(--er)}.grp{margin-top:12px}
.wch{width:100%;height:auto;display:block;margin:4px 0 8px}
.wl{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.wd{fill:var(--ac)}
.wg{stroke:var(--tm);stroke-width:1;stroke-dasharray:4 4}
.wt{fill:var(--tm);font-size:10px}
.wtl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.wtl>*{display:block;background:var(--s2);border:0;border-radius:12px;padding:10px 12px;text-align:left;min-width:0;color:inherit;line-height:1.25}
.wtl b{display:block;font-size:20px;letter-spacing:-.02em}.wtl b small{font-size:13px;color:var(--tm);font-weight:400}
.wtl span{font-size:13px;color:var(--tm)}
.wkr{display:flex;align-items:baseline;gap:8px;padding:6px 0}.wkr span{flex:1;font-size:14px;color:var(--tm)}.wkr b{font-size:17px}.wkr small{min-width:60px;text-align:right;font-size:12px;color:var(--tm)}.wkr small.pos{color:var(--ok)}.wkr small.neg{color:var(--er)}
.bars{display:flex;gap:6px;height:64px;margin:6px 0 4px}.bars div{flex:1;height:100%;display:flex;align-items:flex-end}.bars i{display:block;width:100%;background:var(--ac);border-radius:6px 6px 2px 2px}
.bl{display:flex;gap:6px}.bl span{flex:1;text-align:center;font-size:10px;color:var(--tm)}
.pb{height:4px;border-radius:4px;background:var(--s2);margin:4px 0 8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
.seg{display:flex;background:var(--s2);border-radius:10px;padding:3px}.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;color:var(--tm)}.seg .on{background:var(--s);color:var(--tx);font-weight:600;box-shadow:var(--sh2)}
.av{width:48px;height:48px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-weight:700;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}.heat i{aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--ac) calc(var(--l,0)*100%),var(--s2))}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tm)}.dot.ok{background:var(--ok)}.dot.off{background:var(--er)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--w);z-index:5;background:var(--s);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:var(--shn)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;min-height:56px;color:var(--tm);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav .on{color:var(--ac);font-weight:600}
dialog{border:0;border-radius:18px 18px 0 0;background:var(--s);color:var(--tx);width:100%;max-width:520px;margin:auto auto 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90dvh;box-shadow:var(--sh3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
html:has(dialog[open]),body:has(dialog[open]){overflow:hidden}
dialog{overscroll-behavior:contain}
dialog[open]::before{display:none}
.grab{height:44px;margin:-18px -16px 6px;display:flex;justify-content:center;align-items:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:36px;height:4px;border-radius:4px;background:var(--bd)}
@media(min-width:600px){dialog{margin:auto;border-radius:18px}}
dialog label{display:block;font-size:13px;color:var(--tm);margin:12px 0 4px}dialog .ckl{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#to{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}#to.on{opacity:1}
.dock{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:var(--w);bottom:calc(57px + env(safe-area-inset-bottom));z-index:4;background:linear-gradient(to bottom,transparent,var(--bg) 35%);padding:14px 12px 8px;pointer-events:none}
.dock>*{pointer-events:auto}
.dock .add{background:var(--s);border-radius:28px;padding:5px;gap:6px;align-items:center;box-shadow:var(--sh3)}
.dock .add input{background:transparent;border-radius:24px;min-height:44px;padding:0 16px}.dock .btn{border-radius:22px;min-width:64px;min-height:44px}
.dock .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 8px;padding:2px 12px 4px;scrollbar-width:none}.dock .chips::-webkit-scrollbar{display:none}
.dock .chip{flex:none;min-height:36px;padding:0 14px;font-size:14px;border-radius:18px;background:var(--s);box-shadow:0 1px 4px rgba(0,0,0,.1)}
body.kb nav{display:none}body.kb .dock{bottom:var(--kb,0px)}
dialog::before{content:"";display:block;width:36px;height:4px;border-radius:4px;background:var(--bd);margin:-6px auto 14px}
dialog[open]{animation:up .22s ease}@keyframes up{from{transform:translateY(28px);opacity:0}}
dialog .btns .btn{flex:1}@media(max-width:599px){dialog{margin-bottom:var(--kb,0px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<span id="sy" class="dot" hidden></span>
<main id="v"></main>
<div class="dock" id="dk" hidden></div><nav><button data-t="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>Today</button><button data-t="train"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Train</button><button data-t="budget"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2M3 10h18"/></svg>Budget</button><button data-t="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Stats</button></nav>
<dialog id="sh"></dialog><div id="to"></div>
<script type="module" src="app.js"></script>
</body>
</html>
